<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zerodha</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>

<body>

    <nav style="display:flex; justify-content:space-between; padding:10px;">

        <img 
            width="150" 
            height="20"
            src="https://zerodha.com/static/images/logo.svg" 
            alt="logo"
            style="padding-top:2px; padding-bottom:2px;"
        >

        <div>
            <a href="https://www.zerodha.com/" target="_blank">Sign up</a>
            <a href="https://www.zerodha.com/" target="_blank">Products</a>
            <a href="https://www.zerodha.com/" target="_blank">Pricing</a>
            <a href="https://www.zerodha.com/" target="_blank">Support</a>
            <a href="https://www.zerodha.com/" target="_blank">Zerodha</a>
        </div>

    </nav>

    <div>
        <img 
            src="https://zerodha.com/static/images/landing.svg" 
            alt="Zerodha landing image"
        >
    </div>

    <div>
        <center>
            <h1>Invest in everything</h1>
        </center>
    </div>

    <div>
        <center>
            <p>
                Online platform to invest in stocks, derivatives, mutual funds,
                ETFs, bonds, and more.
            </p>
        </center>
    </div>

    <center>
        <button style="background:blue; font-size:20px; color:white;">
            Sign up for free
        </button>
    </center>

</body>
</html>
